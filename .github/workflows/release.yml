name: Release

# Pushing a tag like v0.8.0 builds grids.exe on Windows and publishes a GitHub Release
# with grids.exe + grids.exe.sha256 (what the in-app updater downloads and verifies).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: rustup toolchain install && rustup show

      # the tag is the version the updater compares against; every crate must agree with it
      - name: Check tag matches crate versions
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $meta = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $bad = @()
          foreach ($name in 'grids', 'grids_core', 'grids_shell') {
            $pkg = $meta.packages | Where-Object name -eq $name
            if (!$pkg) { $bad += "$name missing"; continue }
            "$name $($pkg.version)"
            if ("v$($pkg.version)" -ne $tag) { $bad += "$name is $($pkg.version)" }
          }
          if ($bad) { throw "tag $tag does not match crate versions: $($bad -join ', ')" }

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Locate fxc.exe
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object { [version]($_.Directory.Parent.Name) } -Descending | Select-Object -First 1
          if (!$fxc) { throw 'fxc.exe not found in the Windows SDK' }
          Write-Host "fxc: $($fxc.FullName)"
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test
        timeout-minutes: 15
        run: cargo test --release --locked --workspace

      # grids.exe.sha256 is "<lowercase hex>  grids.exe", ASCII, no BOM, one LF
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/grids.exe dist/grids.exe
          $exe = Get-Item dist/grids.exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/dist/grids.exe.sha256", "$hash  grids.exe`n", [Text.Encoding]::ASCII)
          if (Test-Path target/release/grids.pdb) {
            Compress-Archive -Path target/release/grids.pdb -DestinationPath dist/grids-symbols.zip
          }
          Get-ChildItem dist | Format-Table Name, Length
          "## ${{ github.ref_name }}" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "grids.exe: $($exe.Length) bytes, SHA256 ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @('dist/grids.exe', 'dist/grids.exe.sha256')
          if (Test-Path dist/grids-symbols.zip) { $files += 'dist/grids-symbols.zip' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            # re-running the job for an existing release replaces its assets
            gh release upload $tag @files --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @files --verify-tag --title "Grids $tag" --generate-notes --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed ($LASTEXITCODE)" }
