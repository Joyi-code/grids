# Platform layer: Windows Shell APIs on Windows, std fallbacks elsewhere.
[package]
name = "grids_shell"
version = "0.8.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
