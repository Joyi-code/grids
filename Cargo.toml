[package]
name = "grids"
version = "0.9.4"
edition = "2024"
description = "Fast multi-pane file manager, drawn with GPUI"
license = "MIT"
repository = "https://github.com/Joyi-code/grids"
publish = false

[workspace]
members = ["crates/core", "crates/shell"]
default-members = [".", "crates/core", "crates/shell"]

[dependencies]
grids_core = { path = "crates/core" }
grids_shell = { path = "crates/shell" }
anyhow = "1.0.104"
gpui = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
log = "0.4"
sys-locale = "0.3.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
smallvec = "1"
unicode-segmentation = "1.13.3"
notify = { version = "8", default-features = false }
futures = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_Diagnostics_Debug"] }

[build-dependencies]
embed-resource = "3.0.12"

# GPUI 0.2.2 and taffy 0.9.0 with quiet-md's local patches (see vendor/PATCHES.md).
[patch.crates-io]
gpui = { path = "vendor/gpui" }
taffy = { path = "vendor/taffy" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
field_reassign_with_default = "allow"

[lints]
workspace = true

[profile.release]
# Size first: small code everywhere, full speed for the
# layout / rendering hot paths. Fat LTO and one codegen unit let the linker
# drop what Grids never calls.
opt-level = "z"
lto = "fat"
codegen-units = 1
# Line tables go to grids.pdb (a separate file on Windows, uploaded as the
# symbols artifact), not into grids.exe; crash-log offsets resolve with it.
# strip = true would make rustc pass /DEBUG:NONE on MSVC and no pdb would be
# written at all, so stripping is left to the linker (the exe has no symbols).
debug = "line-tables-only"
strip = "none"
# The panic hook still writes grids-crash.log (module base + offsets) first.
panic = "abort"

[profile.release.package.gpui]
opt-level = 3
[profile.release.package.taffy]
opt-level = 3




