[package]
name = "grids"
version = "0.8.0"
edition = "2024"
description = "Fast multi-pane file manager, drawn with GPUI"
license = "MIT"
repository = "https://github.com/Joyi-code/grids"
publish = false

[workspace]
members = ["crates/core", "crates/shell"]
default-members = [".", "crates/core", "crates/shell"]

[dependencies]
grids_core = { path = "crates/core" }
grids_shell = { path = "crates/shell" }
anyhow = "1.0.104"
gpui = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
log = "0.4"
sys-locale = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]

# GPUI 0.2.2 and taffy 0.9.0 with quiet-md's local patches (see vendor/PATCHES.md).
[patch.crates-io]
gpui = { path = "vendor/gpui" }
taffy = { path = "vendor/taffy" }
xattr = { path = "vendor/xattr" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
field_reassign_with_default = "allow"

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
